name: CI
on:
  push:
   branches:[main]
pull_request:

permission:
  contents:read

jobs:
  teste:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
      node:[20, 22]

steps:
- uses: actions/checkout@v4

- uses: actions/setup-node@v4
with:
  node-version ${{ matrix.node}}
  cache: npm

- run: npm ci

- run: npm test -- --coverage

- uses: actions/upload-artifact@v4
if: always()
with:
  name: coverage-node-${{ matrix.node}}
  path: coverage/




